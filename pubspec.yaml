name: lexcheck
description: "LexCheck - Retro terminal legal-tech UI (UI only, static mock data)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1
  http: ^1.2.2
  file_picker: ^8.0.0
  url_launcher: ^6.3.0
  share_plus: ^10.0.0
  shared_preferences: ^2.3.0
  geolocator: ^13.0.2
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
